<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soluciones Digitales | Nospi & ViO</title>
    <style>
        :root {
            --nospi-color: #2563eb;
            --vio-color: #7c3aed;
            --whatsapp-color: #22c55e;
        }
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: linear-gradient(135deg, #f0f4f8, #e2e8f0);
            display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0;
        }
        .container { 
            background: rgba(255, 255, 255, 0.9); padding: 40px; border-radius: 25px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 90%; max-width: 400px; text-align: center;
        }
        h1 { color: #1e293b; margin-bottom: 10px; }
        p { color: #64748b; margin-bottom: 30px; }
        
        .btn { 
            display: block; color: white; padding: 18px; margin: 15px 0; text-decoration: none; 
            border-radius: 12px; font-weight: 700; transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .btn:hover { transform: translateY(-3px); box-shadow: 0 8px 15px rgba(0,0,0,0.2); }
        
        .btn-nospi { background: var(--nospi-color); }
        .btn-vio { background: var(--vio-color); }
        .btn-whatsapp { background: var(--whatsapp-color); }
    </style>
</head>
<body>
    <div class="container">
        <h1>Potencia tu negocio</h1>
        <p>Selecciona tu solución para conocerla a detalle:</p>

   

       <!-- El Botón -->
<button onclick="document.getElementById('videoModal').style.display='block'" class="btn btn-nospi">🚀 Ver Solución Nospi</button>

<!-- El Contenedor del video (Modal) -->
<div id="videoModal" style="display:none; position:fixed; z-index:9999; left:0; top:0; width:100%; height:100%; background-color:rgba(0,0,0,0.9);">
  <span onclick="document.getElementById('videoModal').style.display='none'" style="position:absolute; top:15px; right:35px; color:white; font-size:40px; cursor:pointer;">&times;</span>
  <div style="display:flex; justify-content:center; align-items:center; height:100%;">
    <iframe width="320" height="560" 
        src="https://www.youtube.com/embed/UQY_78bG9ow?autoplay=1&mute=1&rel=0&modestbranding=1&cc_load_policy=0" 
        frameborder="0" 
        allow="autoplay; encrypted-media" 
        allowfullscreen>
</iframe>

  </div>
</div>


  <!-- El Botón -->
<button onclick="document.getElementById('videoModal').style.display='block'" class="btn btn-vio">⚙️ Ver Solución ViO</button>

<!-- El Contenedor del video (Modal) -->
<div id="videoModal" style="display:none; position:fixed; z-index:9999; left:0; top:0; width:100%; height:100%; background-color:rgba(0,0,0,0.9);">
  <span onclick="document.getElementById('videoModal').style.display='none'" style="position:absolute; top:15px; right:35px; color:white; font-size:40px; cursor:pointer;">&times;</span>
  <div style="display:flex; justify-content:center; align-items:center; height:100%;">
    <iframe width="320" height="560" 
        src="https://youtube.com/shorts/wPPKooBX_y4?feature=share?autoplay=1&mute=1&rel=0&modestbranding=1&cc_load_policy=0" 
        frameborder="0" 
        allow="autoplay; encrypted-media" 
        allowfullscreen>
</iframe>

  </div>
</div>
        



        
        <hr style="margin: 30px 0; opacity: 0.2;">
        
        <a href="https://wa.me/TU_NUMERO" class="btn btn-whatsapp">💬 Hablar con un asesor</a>
    </div>
</body>
</html>
