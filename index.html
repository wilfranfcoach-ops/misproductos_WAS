<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soluciones Digitales | Nospi & ViO</title>
    <style>
        :root {
            --nospi-color: #2563eb;
            --vio-color: #7c3aed;
            --whatsapp-color: #22c55e;
        }
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: linear-gradient(135deg, #f0f4f8, #e2e8f0);
            display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0;
        }
        .container { 
            background: rgba(255, 255, 255, 0.9); padding: 40px; border-radius: 25px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 90%; max-width: 400px; text-align: center;
        }
        h1 { color: #1e293b; margin-bottom: 10px; }
        p { color: #64748b; margin-bottom: 30px; }
        
        .btn { 
            display: block; color: white; padding: 18px; margin: 15px 0; text-decoration: none; 
            border-radius: 12px; font-weight: 700; transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .btn:hover { transform: translateY(-3px); box-shadow: 0 8px 15px rgba(0,0,0,0.2); }
        
        .btn-nospi { background: var(--nospi-color); }
        .btn-vio { background: var(--vio-color); }
        .btn-whatsapp { background: var(--whatsapp-color); }

       .btn-moderno {
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 10px;
                padding: 16px 20px;
                font-size: 16px;
                font-weight: 600;
                color: #ffffff !important; /* Fuerza el color blanco */
                border: none;
                border-radius: 50px; 
                cursor: pointer;
                text-decoration: none;
                margin: 0 auto 15px auto;
                width: 90%;
                max-width: 350px;
                /* Efecto 3D: Sombra suave abajo y luz sutil arriba */
                box-shadow: 0 6px 0px rgba(0,0,0,0.2), 0 4px 10px rgba(0,0,0,0.3);
                transition: all 0.2s ease;
            }

.btn-moderno:active {
    /* Al hacer clic, el botón baja un poco para simular el 3D */
    transform: translateY(4px);
    box-shadow: 0 2px 0px rgba(0,0,0,0.2);
}

/* Degradados profesionales */
.btn-nospi { background: linear-gradient(180deg, #4f8af5, #2563eb); }
.btn-vio { background: linear-gradient(180deg, #a855f7, #7e22ce); }
.btn-asesor { background: linear-gradient(180deg, #22c55e, #16a34a); }
    </style>
</head>
<body>
    <div class="container">
        <h1>Potencia tu negocio</h1>
        <p>Selecciona tu solución para conocerla a detalle:</p>

   
     <!-- El Botón NOSPI-->
<button onclick="openModal('videoModal')" class="btn-moderno btn-nospi">
    🚀 Ver Solución Nospi
</button>

        
        <!-- El Contenedor del video (Modal) -->
<div id="videoModal" style="display:none; position:fixed; z-index:9999; left:0; top:0; width:100%; height:100%; background-color:rgba(0,0,0,0.95); backdrop-filter: blur(5px);">
  <span onclick="closeModal('videoModal')" style="position:absolute; top:20px; right:40px; color:white; font-size:50px; cursor:pointer; z-index:10000;">&times;</span>
  <div style="display:flex; justify-content:center; align-items:center; height:100%;">
    <div style="max-width: 90%; max-height: 90%;">
      <iframe id="videoPlayer" width="320" height="560" 
        src="https://www.youtube.com/embed/UQY_78bG9ow?enablejsapi=1&autoplay=1&mute=0&rel=0&modestbranding=1"
        frameborder="0" allow="autoplay; encrypted-media" allowfullscreen>
      </iframe>
    </div>
  </div>
</div>


        <!-- El Botón VIO-->
<button onclick="openModal('videoModal2')" class="btn-moderno btn-vio">⚙️ Ver Solución ViO</button>


        
        <!-- El Contenedor del video (Modal2) -->
<div id="videoModal2" style="display:none; position:fixed; z-index:9999; left:0; top:0; width:100%; height:100%; background-color:rgba(0,0,0,0.95); backdrop-filter: blur(5px);">
  <span onclick="closeModal('videoModal2')" style="position:absolute; top:20px; right:40px; color:white; font-size:50px; cursor:pointer; z-index:10000;">&times;</span>
  <div style="display:flex; justify-content:center; align-items:center; height:100%;">
    <iframe id="videoPlayer2" width="320" height="560" 
        src="https://www.youtube.com/embed/2NWV09sbZis?enablejsapi=1&autoplay=1&mute=0&rel=0&modestbranding=1"
        frameborder="0" 
        allow="autoplay; encrypted-media" 
        allowfullscreen>
</iframe>

  </div>
</div>



    <!--<a href="https://youtube.com/shorts/wPPKooBX_y4?feature=share" class="btn btn-vio">⚙️ Ver Solución ViO</a>-->



        
        <hr style="margin: 30px 0; opacity: 0.2;">
        
        <a href="https://wa.me/573052449448" class="btn btn-whatsapp">💬 Hablar con un asesor</a>
    </div>

<script>
function openModal(id) {
    var modal = document.getElementById(id);
    if (modal) {
        modal.style.display = 'block';
    }
}
    
function closeModal(id) {
    var modal = document.getElementById(id);
    if (modal) {
        modal.style.display = 'none';
        
        // Buscamos el iframe dentro de ESE modal específico
        var iframe = modal.querySelector('iframe');
        if (iframe) {
            var urlOriginal = iframe.src;
            iframe.src = ""; // Cortar audio
            setTimeout(function() {
                iframe.src = urlOriginal; // Restaurar
            }, 100);
        }
    }
}
</script>
</body>
</html>
